services:
  # ===========================================================================
  # Base de datos
  # ===========================================================================
  # Vive en la red `backend` (internal: true), por lo que NO es alcanzable
  # desde el host ni desde Internet: solo la API puede hablar con ella.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securekey}
      POSTGRES_USER: ${POSTGRES_USER:-securekey}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env - ejecuta npm run secrets}"
      # scram-sha-256 en vez de md5, que sigue activo por compatibilidad.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-securekey}" -d "${POSTGRES_DB:-securekey}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  # ===========================================================================
  # Migraciones: servicio one-shot. La API no arranca hasta que termina bien.
  # ===========================================================================
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: securekey/api:latest
    command: ["node", "apps/api/dist/db/migrate.js"]
    environment: &api_env
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost:8443}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost:8443}
      DATABASE_URL: postgres://${POSTGRES_USER:-securekey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securekey}
      AUTH_PEPPER: "${AUTH_PEPPER:?falta AUTH_PEPPER en .env - ejecuta npm run secrets}"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-19456}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-2}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      ARGON2_KDF_VERSION: ${ARGON2_KDF_VERSION:-1}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_SECRET: ${INVITE_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERSION: ${VERSION:-0.1.0}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

  # ===========================================================================
  # API
  # ===========================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: securekey/api:latest
    environment: *api_env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
      - edge
    restart: unless-stopped
    # Contenedor endurecido: sin escritura, sin capacidades, sin privilegios.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    # El puerto NO se publica: solo Caddy alcanza la API.

  # ===========================================================================
  # Frontend compilado + nginx
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    image: securekey/web:latest
    # nginx oficial arranca como root para escuchar en :80 y luego baja a los
    # workers. Aqui arranca YA como el usuario 101 (nginx) y con el rootfs en
    # solo lectura: no puede hacer chown, y ademas los scripts del entrypoint
    # solo lo intentan cuando detectan uid 0, asi que se saltan solos.
    #
    # El bind de :80 sigue funcionando porque Docker pone por defecto
    # `net.ipv4.ip_unprivileged_port_start=0` dentro del contenedor.
    #
    # Resultado: menos privilegios que antes y, sobre todo, no dependemos de
    # Capabilities opcionales para que el contenedor arranque.
    user: "101:101"
    depends_on:
      api:
        condition: service_started
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      # mode=1777: directorios vacios en memoria y escribibles por el usuario
      # del servicio. Sin mode, el tmpfs nace 0755 y nginx no puede escribir.
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /run:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  # ===========================================================================
  # Caddy: unico puerto publicado (8443).
  # ===========================================================================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8443}:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados de la CA interna: en un volumen, no en el contenedor.
      - caddydata:/data
      - caddyconfig:/config
      # Access log con la rotacion de Caddy. Sin este volumen la escritura
      # falla y Caddy no arranca.
      - caddylogs:/var/log/caddy
    depends_on:
      - web
      - api
    networks:
      - edge
    # El binario de la imagen oficial de Caddy viene con el file capability
    # `cap_net_bind_service=ep`. Si esa capacidad no esta en el bounding set,
    # `execve` devuelve EPERM y el contenedor entra en un bucle de reinicio con
    # un desconcertante "exec /usr/bin/caddy: operation not permitted".
    #
    # Por eso aqui no vale un `cap_drop: ALL` a secas: hay que devolver esa
    # capacidad, aunque Caddy escuche en 8443 y no la necesite para nada.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

  # ===========================================================================
  # Podador de la bitacora de seguridad.
  #
  # `audit_log` se escribe desde la red sin autenticar (una fila por cada
  # login fallido) y cada fila cuesta el heap mas tres indices. Sin este
  # servicio el disco se llena solo: es una denegacion de servicio gratuita
  # para quien sepa la URL. Ver `apps/api/src/db/prune-audit.ts`.
  #
  # Es un bucle con `sleep` y no un cron del host a proposito: asi el
  # temporizador viaja con el `docker compose up` de la VPS y no hay que
  # recordar instalarlo ni que se pierde al reiniciar.
  # ===========================================================================
  prune:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: securekey/api:latest
    command: ["sh", "-c", "while true; do node apps/api/dist/db/prune-audit.js; sleep 21600; done"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-securekey}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securekey}
      # Solo los que leen el entorno; el resto sale con sus defaults.
      AUDIT_KEEP_DAYS: ${AUDIT_KEEP_DAYS:-30}
      AUDIT_MAX_ROWS: ${AUDIT_MAX_ROWS:-500000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64

  # Los servicios de test viven en `docker-compose.test.yml`, NO aqui.
  #
  # Estaban en este fichero con un perfil, y eso era un pieguno en un servidor
  # publico: `docker compose --profile test up` levantaba un SEGUNDO
  # PostgreSQL con la contrasena fija `securekey_test_local` en la red
  # `backend`. No era alcanzable desde Internet, pero existia, consumia ~70 MB
  # de memoria y era un segundo postgres que nadie tenia presente. En la VPS
  # no debe existir siquiera la opcion.
networks:
  # `edge` conecta lo que el navegador ve; `backend` es interna y sin salida,
  # de modo que ni la base de datos ni la API pueden alcanzar Internet.
  edge: {}
  backend:
    internal: true

volumes:
  pgdata: {}
  caddydata: {}
  caddyconfig: {}
  caddylogs: {}
