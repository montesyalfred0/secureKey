# Configuracion de nginx para el frontend compilado.
# Todo lo que no sea un fichero estatico cae en index.html (SPA de una pagina),
# y /api se reenvia al contenedor de la API.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Limite holgado: una boveda con muchos items llega facil a megabytes.
    client_max_body_size 4m;

    # ---------------------------------------------------------------
    # Compresion. El bundle ya viene minificado; comprimirlo ahorra ~30 %.
    # ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # ---------------------------------------------------------------
    # API
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------
    # Salud del propio contenedor (la usa el HEALTHCHECK del Dockerfile).
    # ---------------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # Assets con hash en el nombre: cache inmutable e indefinido.
    # ---------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # El favicon puede cambiar sin hash: cacheo corto.
    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------------
    # index.html NUNCA se cachea: es quien apunta a los hashes nuevos.
    # Cachear esto es la causa clasica de "mi deploy no se ve".
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de ultimo recurso. Caddy tambien las envia; duplicar aqui
    # protege el caso de alguien que abra el puerto 80 desde la red interna.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Ficheros ocultos (.env, .git...) nunca se sirven.
    location ~ /\. {
        deny all;
        access_log off;
    }
}
