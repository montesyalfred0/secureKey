# ===========================================================================
# Capa de PRODUCCION. Un dominio real y Let's Encrypt.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# REQUISITOS, en este orden o no arranca:
#   1. Un dominio con registro DNS `A`/`AAAA` a la IP de la VPS. Let's Encrypt
#      NO emite certificados para IPs desnudas.
#   2. Puertos 80 y 443 ABIERTOS. El 80 lo necesita el desafio HTTP-01. Si tu
#      proveedor lo bloquea, cambia el `tls` del Caddyfile.prod por el desafio
#      DNS-01:  tls { dns cloudflare {env.CF_API_TOKEN} }
#   3. En el `.env`: APP_ORIGIN, ALLOWED_ORIGINS y APP_HOST con el dominio.
#      Si se olvidan, la API responde 403 al registro y al login: el hook
#      `onRequest` rechaza cualquier `Origin` fuera de la lista.
#
# Lo que cambia respecto al compose de desarrollo, y por que:
#
#   1. Caddy pasa a 443 y a Let's Encrypt. Ademas se abre el 80, que solo
#      sirve para el desafio de la CA y la redireccion a HTTPS: la app nunca se
#      sirve en claro.
#   2. `prune` pasa a cada hora en vez de cada seis. En produccion el relleno
#      de la bitacora es un vector real de denegacion de servicio, y seis horas
#      es una ventana larga.
#   3. Limites de memoria y parametros de Postgres.
#
# NO se publica aqui ningun puerto de la base de datos ni de la API. Lo unico
# que escucha hacia Internet es Caddy.
# ===========================================================================
services:
  caddy:
    image: caddy:2-alpine
    environment:
      # El Caddyfile.prod usa {$APP_HOST} para no tener que editarlo al
      # cambiar de host.
      APP_HOST: ${APP_HOST:?falta APP_HOST en el .env - pon tu dominio}
    # `!override` reemplaza la lista de puertos heredada del compose base en
    # vez de fusionarse con ella. Sin esto compose las concatena y el
    # contenedor acaba publicando 8443 ademas de 80 y 443: verificado, el
    # despliegue de produccion dejaba el puerto de desarrollo abierto a
    # Internet. (Con `!reset` en su lugar la lista entera desaparece, porque esa
    # etiqueta descarta el valor en vez de sustituirlo.)
    #
    # Tampoco vale dejar 8443 "por si acaso": es el puerto del `Caddyfile` de
    # desarrollo y en produccion no lo escucha nadie. Seria un puerto abierto
    # que no sirve para nada.
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
      - caddylogs:/var/log/caddy
    # El binario de la imagen oficial lleva el file capability
    # `cap_net_bind_service=ep`. Sin esa capacidad en el bounding set, `execve`
    # devuelve EPERM y el contenedor entra en bucle de reinicio con
    # "exec /usr/bin/caddy: operation not permitted". Aqui es estrictamente
    # necesaria: se escuchan puertos privilegiados.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  prune:
    # Cada hora. `prune-audit.js` es idempotente y no puede tumbar el servicio:
    # si falla, avisa por stderr y sale con codigo 0.
    command: ["sh", "-c", "while true; do node apps/api/dist/db/prune-audit.js; sleep 3600; done"]
    mem_limit: 128m

  api:
    # El base declara `mem_limit: 512m`, aqui se sube a 768M. `!override` y no
    # `!reset`: el compose 2.24+ fusiona `deploy` con los campos de la version
    # antigua, y sin el no se aplicaria el limite.
    mem_limit: !override 768M

  db:
    # `mem_limit` y no `deploy.resources.limits`: el compose base ya usa
    # `mem_limit`, y mezclar las dos formas con `pids_limit` hace que compose no
    # pueda fusionar los limites.
    #
    # 512M es un suelo razonable para una boveda personal. Con muchos usuarios,
    # subir `shared_buffers` en proportion.
    mem_limit: 512M
    shm_size: 256mb
    command:
      - postgres
      # Reemplaza los defaults tan conservadores de Postgres. Con la RLS activa
      # y `statement_timeout` en el pool, estos son la red de seguridad que
      # impide que una consulta patologica se coma la memoria del servidor.
      - -c
      - max_connections=50
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      # Una consulta de mas de 1 s es un bug o un ataque. Aparece en el log de
      # Postgres, que es distinto del access log de Caddy.
      - -c
      - log_min_duration_statement=1000
